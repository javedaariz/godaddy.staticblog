name: Check
# Runs on every pull request and on branches, so you can validate before anything is published.
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build   # also runs the internal link check
      - uses: actions/upload-artifact@v4
        with: { name: site-preview, path: dist, retention-days: 7 }
